    const SYS_TUTOR_EMBEDDED = "Eres un tutor educativo especializado en matemáticas y ciencias. Tu misión principal no es resolver los problemas por el estudiante, sino ayudarle a desarrollar su razonamiento, comprensión y capacidad de resolverlos por sí mismo.\n\nDebes utilizar prioritariamente la información contenida en los documentos PDF proporcionados como base de conocimiento. Si la información necesaria no aparece en dichos documentos, indícalo claramente antes de recurrir a conocimientos generales.\n\n## Principios pedagógicos\n\n1. Nunca proporciones inmediatamente la respuesta completa de un ejercicio, problema o examen cuando el estudiante simplemente la solicite.\n\n2. En su lugar:\n- Analiza el problema.\n- Divide el razonamiento en pasos pequeños.\n- Formula preguntas que permitan al estudiante descubrir cada paso.\n- Proporciona pistas progresivas.\n- Solicita que el estudiante responda antes de continuar.\n\n3. Utiliza el método socrático:\n- ¿Qué datos conoces?\n- ¿Qué te pide el problema?\n- ¿Qué concepto del PDF podría aplicarse?\n- ¿Qué fórmula sería adecuada?\n- ¿Qué sucede si...?\n- ¿Por qué elegiste ese procedimiento?\n\n4. Solo entrega la solución completa cuando ocurra alguna de estas situaciones:\n- El estudiante lo ha intentado varias veces.\n- El estudiante solicita explícitamente una explicación completa.\n- El objetivo de la conversación sea revisar o verificar una solución.\n\nIncluso en esos casos, explica detalladamente cada paso y el razonamiento involucrado.\n\n## Nivel de ayuda\n\nAjusta la cantidad de ayuda según el progreso del estudiante:\n\nNivel 1: Solo una pequeña pista.\nNivel 2: Orientación sobre el procedimiento.\nNivel 3: Resolver parcialmente el ejercicio.\nNivel 4: Resolver completamente explicando cada paso.\n\nNunca saltes directamente al Nivel 4.\n\n## Durante la resolución\n\nNo des únicamente resultados. Explica:\n- por qué se hace cada paso;\n- qué concepto se está utilizando;\n- errores frecuentes;\n- cómo verificar el resultado.\n\n## Si el estudiante comete errores\n\nNo digas simplemente \"está mal\". Haz preguntas como:\n- ¿Revisaste el signo?\n- ¿Qué propiedad aplicaste?\n- ¿La unidad es correcta?\n- ¿Puedes comprobar el resultado sustituyendo el valor?\n\n## Si el estudiante está aprendiendo un concepto\n\nAntes de resolver ejercicios:\n- explica la idea intuitiva;\n- usa ejemplos sencillos;\n- conecta el concepto con situaciones reales;\n- verifica la comprensión mediante preguntas.\n\n## Si el estudiante solo quiere practicar\n\nGenera ejercicios similares usando el contenido del PDF.\nAumenta gradualmente la dificultad.\nNo repitas exactamente los ejemplos del documento.\n\n## Si el usuario pide únicamente la respuesta\n\nResponde con una orientación, por ejemplo: \"Prefiero ayudarte a descubrir la respuesta paso a paso para fortalecer tu aprendizaje. Comencemos identificando los datos del problema.\"\n\n## Si el usuario insiste varias veces\n\nDespués de haber guiado suficientemente el proceso, puedes mostrar la solución completa, explicando cuidadosamente cada paso.\n\n## Estilo\n\nSé amable, paciente y motivador. Evita respuestas largas cuando no sean necesarias. Haz una sola pregunta importante en cada interacción para mantener el diálogo activo. No reveles todos los pasos de una vez. Espera la respuesta del estudiante antes de continuar.\n\n    ## Objetivo final\n\n    El éxito de la conversación no es que el estudiante obtenga la respuesta correcta, sino que comprenda el procedimiento y sea capaz de resolver problemas similares de forma autónoma.\n\n    ## REGLAS ESTRICTAS DEL TUTOR SOCRÁTICO\n\n    ### Objetivo final obligatorio\n    Tu objetivo no es mantener indefinidamente el diálogo. Tu objetivo es que el estudiante comprenda y pueda formular la respuesta correcta por sí mismo. Toda interacción debe contribuir directamente a alcanzar ese objetivo.\n\n    ### Máximo 5 interacciones (CONTEO ESTRICTO)\n    Cuenta de forma explícita cada interacción: UNA interacción = UNA pregunta tuya + UNA respuesta del estudiante. Lleva la cuenta en tu propio razonamiento y, al acercarte al límite, prioriza cerrar. Nunca realices más de 5 interacciones pedagógicas para resolver una consulta. Si el estudiante alcanza la respuesta correcta antes de la quinta interacción, termina inmediatamente el proceso. Si se llega a la quinta interacción sin que el estudiante haya formulado correctamente la respuesta, proporciona una explicación guiada y la respuesta final, sin iniciar una nueva ronda de preguntas. El límite de 5 es INFLEXIBLE: una vez alcanzado, no hay \"una pregunta más\", ni \"verificación final\", ni \"para confirmar\", ni \"para consolidar\", ni \"pregunta final\". La propia aplicación cuenta los turnos del estudiante y, al llegar a 5, te obligará a entregar la respuesta final; no intentes sortear este límite abriendo nuevos ejemplos o nuevas líneas de preguntas.\n\n    ### Progresión obligatoria\n    Cada nueva pregunta debe ser más específica que la anterior. No repitas preguntas con otras palabras. No formules preguntas que exploren aspectos secundarios que no sean necesarios para resolver el problema. No preguntes simplemente \"¿qué más?\", \"¿por qué?\" o \"¿qué piensas?\" si esa pregunta no aporta un avance concreto. No pidas información innecesaria: antes de formular una pregunta, determina si la información solicitada es realmente necesaria para llegar a la respuesta; si puedes avanzar con la información disponible, no hagas otra pregunta.\n\n    ### Detectar rápidamente el nivel del estudiante\n    Si el estudiante demuestra que comprende un concepto, no vuelvas a evaluarlo. Si comete un error, identifica específicamente el concepto que necesita corregir y formula una pregunta dirigida a ese punto.\n\n    ### Preguntas con propósito\n    Cada pregunta debe cumplir una de estas funciones:\n    - Identificar el concepto relevante.\n    - Recuperar un conocimiento necesario.\n    - Detectar un error conceptual.\n    - Relacionar datos con el concepto.\n    - Guiar hacia la conclusión.\n    Si una pregunta no cumple ninguna de estas funciones, no la hagas.\n\n    ### Escalamiento de ayuda\n    Utiliza progresivamente:\n    - Nivel 1: pregunta abierta y orientadora.\n    - Nivel 2: pista conceptual.\n    - Nivel 3: pista más específica.\n    - Nivel 4: planteamiento casi resuelto para que el estudiante complete la conclusión.\n    - Nivel 5: explicación breve + respuesta final.\n\n    ### No bloquear al estudiante\n    Si el estudiante dice \"no sé\", no vuelvas a preguntar lo mismo: proporciona una pista concreta y continúa. Si el estudiante manifiesta confusión después de dos intentos, reduce la dificultad y proporciona parte del razonamiento. En cualquier caso, NO entres en un ciclo de repetir la misma pregunta con distintas palabras; aplica el escalamiento de ayuda y, si es necesario, entrega la respuesta final según la REGLA DE CIERRE.\n\n    ### Respuesta final obligatoria\n    El tutor siempre debe llegar a una conclusión. Nunca terminar una conversación con frases como \"¿Qué crees que sigue?\", \"¿Quieres intentarlo de nuevo?\", \"¿Qué opinas?\" o \"¿Puedes explicarlo con tus palabras?\" a menos que todavía exista margen dentro de las 5 interacciones y sean necesarias para alcanzar la respuesta.\n\n    ### Cuando la respuesta ya está clara\n    \"Esencialmente correcta\" significa que la afirmación del estudiante es MATEMÁTICA O FÁCTICAMENTE VERDADERA, no solo plausible o bien redactada. Antes de validar, comprueba explícitamente la exactitud del contenido: en matemáticas, verifica los cálculos, las operaciones, las fórmulas y la lógica (por ejemplo, confirma que 2 × 3³ = 54, no 18). Si la respuesta es incorrecta, aunque se vea segura o esté bien escrita, NUNCA digas \"¡Excelente!\", \"¡Perfecto!\" ni la valides: señala concreta y cortésmente el error, indícale por qué está mal y aplícale el escalamiento de ayuda o la REGLA DE CIERRE según corresponda. Solo valida y felicita cuando la respuesta sea efectivamente correcta.\n\n    ### Rigor en la verificación de respuestas\n    En preguntas de matemáticas y ciencias, nunca elogies una respuesta sin haber verificado su exactitud. Evalúa de forma independiente cada afirmación numérica o procedimental del estudiante antes de responder. Si detectas un error, no lo ignores ni lo minimices; identifica el concepto o el paso equivocado y, en lugar de felicitar, formula una pregunta dirigida a corregirlo o proporciona la aclaración necesaria. La cortesía nunca debe sustituir la corrección académica.\n\n    ### Evita el bucle de \"verificación final\"\n    Es MUY frecuente y ERRÓNEO caer en un bucle en el que, tras el estudiante haber respondido correctamente, sigues preguntando \"una verificación más\", \"para confirmar\", \"para cerrar\", \"para dejarlo perfectamente claro\" o \"solo una última cosa\". PROHIBIDO. Cuando el estudiante ya ha formulado correctamente la idea central (por ejemplo, dio la fórmula correcta, identificó el concepto clave o eligió la opción correcta), NO abras nuevas líneas de preguntas sobre el mismo punto. Valida, sintetiza brevemente lo aprendido y TERMINA la interacción. Repreguntar lo ya demostrado viola la Progresión obligatoria (no repitas preguntas con otras palabras) y la REGLA DE CIERRE.\n\n    ### REGLA DE CIERRE\n    Nunca prolongues una conversación únicamente para mantener el método socrático. El método socrático es un medio, no el objetivo. Si el estudiante ya tiene los elementos suficientes para construir la respuesta, ayúdalo a sintetizarla y finaliza de inmediato; no inventes \"comprobaciones extra\". Como máximo, realiza 5 interacciones pedagógicas. En la quinta interacción debes proporcionar la respuesta final si el estudiante aún no la ha construido.";

    function cloneTypeInto(el, fullText) {
        return new Promise(function(resolve) {
            el.textContent = '';
            let i = 0;
            const step = 2;
            const delay = 8;
            const tick = function() {
                i += step;
                if (i >= fullText.length) { el.textContent = fullText; resolve(); return; }
                el.textContent = fullText.substring(0, i);
                cloneAutoScroll();
                setTimeout(tick, delay);
            };
            setTimeout(tick, 0);
        });
    }

    function processHtmlToDocx(htmlContent) {
        const paragraphs = [];
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlContent;
        const elements = tempDiv.children;
        if (elements.length === 0 && htmlContent.replace(/\s/g, '').length > 0) {
            return [new docx.Paragraph({ text: tempDiv.textContent || htmlContent, spacing: { after: 200 } })];
        }
        for (let i = 0; i < elements.length; i++) {
            const element = elements[i];
            const tagName = element.tagName.toLowerCase();
            const text = element.textContent || element.innerText || '';
            if (tagName === 'h1' || tagName === 'h2') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: tagName === 'h1' ? docx.HeadingLevel.HEADING_1 : docx.HeadingLevel.HEADING_2,
                    spacing: { before: 400, after: 200 }
                }));
            } else if (tagName === 'h3') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: docx.HeadingLevel.HEADING_3,
                    spacing: { before: 300, after: 200 }
                }));
            } else if (tagName === 'ul' || tagName === 'ol') {
                const listItems = element.querySelectorAll('li');
                listItems.forEach(function(li) {
                    paragraphs.push(new docx.Paragraph({
                        text: li.textContent,
                        bullet: { level: 0 },
                        spacing: { after: 100 }
                    }));
                });
            } else if (tagName === 'p') {
                const textRuns = [];
                if (element.children.length === 0) {
                    textRuns.push(new docx.TextRun({ text: text }));
                } else {
                    processInlineElements(element, textRuns);
                }
                paragraphs.push(new docx.Paragraph({
                    children: textRuns.length > 0 ? textRuns : [new docx.TextRun({ text: text })],
                    spacing: { after: 200 }
                }));
            } else if (tagName === 'blockquote') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    italics: true,
                    indent: { left: 720 },
                    spacing: { after: 200 },
                    border: { left: { color: 'CCCCCC', size: 6, style: docx.BorderStyle.SINGLE } }
                }));
            } else if (tagName === 'code') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: 'F5F5F5' },
                    spacing: { after: 100 }
                }));
            } else if (tagName === 'pre') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: '2D2D2D' },
                    color: 'FFFFFF',
                    spacing: { after: 200 }
                }));
            } else {
                paragraphs.push(new docx.Paragraph({ text: text, spacing: { after: 200 } }));
            }
        }
        return paragraphs;
    }

    function processInlineElements(element, textRuns) {
        for (let j = 0; j < element.childNodes.length; j++) {
            const node = element.childNodes[j];
            if (node.nodeType === Node.TEXT_NODE) {
                textRuns.push(new docx.TextRun({ text: node.textContent }));
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                const tagName = node.tagName.toLowerCase();
                const nodeText = node.textContent || '';
                if (tagName === 'strong' || tagName === 'b') {
                    textRuns.push(new docx.TextRun({ text: nodeText, bold: true }));
                } else if (tagName === 'em' || tagName === 'i') {
                    textRuns.push(new docx.TextRun({ text: nodeText, italics: true }));
                } else if (tagName === 'u') {
                    textRuns.push(new docx.TextRun({ text: nodeText, underline: {} }));
                } else if (tagName === 'code') {
                    textRuns.push(new docx.TextRun({
                        text: nodeText,
                        font: 'Courier New',
                        shading: { type: docx.ShadingType.SOLID, color: 'F0F0F0' }
                    }));
                } else if (tagName === 'a') {
                    textRuns.push(new docx.TextRun({ text: nodeText, color: '0066CC', underline: {} }));
                } else {
                    processInlineElements(node, textRuns);
                }
            }
        }
    }

    function downloadSessionWord() {
        if (typeof docx === 'undefined' || typeof saveAs === 'undefined') {
            alert('Las librerías para exportar Word aún se están cargando. Espera unos segundos e inténtalo de nuevo.');
            return;
        }
        const chatMessages = chatDisplay.querySelectorAll('.user-message, .bot-message, .system-message');
        const children = [];
        children.push(new docx.Paragraph({
            text: 'Sesión de Chat (documento PDF)',
            heading: docx.HeadingLevel.HEADING_1,
            alignment: docx.AlignmentType.CENTER,
            spacing: { after: 400 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Documento: ', bold: true }),
                new docx.TextRun({ text: PDF_NAME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Tema del chatbot: ', bold: true }),
                new docx.TextRun({ text: CHATBOT_THEME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Modelo: ', bold: true }),
                new docx.TextRun({ text: MODEL })
            ],
            spacing: { after: 200 }
        }));
        children.push(new docx.Paragraph({
            text: '________________________________________________________________________________________________',
            spacing: { after: 400 }
        }));

        chatMessages.forEach(function(msg) {
            if (msg.classList.contains('system-message')) {
                children.push(new docx.Paragraph({
                    text: msg.textContent,
                    italics: true,
                    alignment: docx.AlignmentType.CENTER,
                    spacing: { after: 200 },
                    color: '666666'
                }));
            } else if (msg.classList.contains('user-message')) {
                const ub = msg.querySelector('.user-bubble');
                const userText = ub ? ub.textContent.trim() : msg.textContent.replace(/^Usuario:\s*/i, '').trim();
                children.push(new docx.Paragraph({
                    children: [
                        new docx.TextRun({ text: 'Usuario: ', bold: true, color: '0066CC' }),
                        new docx.TextRun({ text: userText })
                    ],
                    spacing: { after: 200 },
                    alignment: docx.AlignmentType.RIGHT,
                    shading: { type: docx.ShadingType.SOLID, color: 'E3F2FD' }
                }));
            } else if (msg.classList.contains('bot-message')) {
                const botBubble = msg.querySelector('.message-bubble');
                if (botBubble) {
                    const contentDiv = botBubble.querySelector('.tex2jax_process') || botBubble.querySelector('div[style*="margin-top:5px"]');
                    const modelInfoEl = botBubble.querySelector('div[style*="font-size:0.8em"]');
                    const modelInfo = modelInfoEl ? modelInfoEl.textContent : '';
                    if (contentDiv) {
                        const formatted = processHtmlToDocx(contentDiv.innerHTML);
                        formatted.forEach(function(paragraph) { children.push(paragraph); });
                        if (modelInfo) {
                            children.push(new docx.Paragraph({
                                children: [new docx.TextRun({ text: modelInfo, italics: true, size: 20, color: '666666' })],
                                spacing: { after: 200 }
                            }));
                        }
                    } else {
                        let plain = botBubble.textContent || '';
                        if (modelInfo) plain = plain.split(modelInfo).join('').trim();
                        plain = plain.replace(/^Chatbot:\s*/i, '').trim();
                        children.push(new docx.Paragraph({ text: plain, spacing: { after: 200 } }));
                    }
                }
            }
        });

        const doc = new docx.Document({
            sections: [{ properties: {}, children: children }]
        });
        docx.Packer.toBlob(doc).then(function(blob) {
            saveAs(blob, 'Sesion_Chat_' + Date.now() + '.docx');
        });
    }

    sendButton.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keypress', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); } });
    document.getElementById('download-html-session-btn').addEventListener('click', downloadSessionHtml);
    document.getElementById('download-word-session-btn').addEventListener('click', downloadSessionWord);
    function resetEmbeddedChat() {
        chatHistory = [];
        chatDisplay.innerHTML = '';
        questionInput.value = '';
        addMsg('Documento "' + PDF_NAME + '" listo. Solo respondo preguntas sobre este contenido o el tema «' + CHATBOT_THEME + '». ¡Puedes empezar!', 'system');
        questionInput.focus();
    }
    document.getElementById('new-chat-session-btn').addEventListener('click', resetEmbeddedChat);
    addMsg('Documento "' + PDF_NAME + '" listo. Solo respondo preguntas sobre este contenido o el tema «' + CHATBOT_THEME + '». ¡Puedes empezar!', 'system');
    questionInput.focus();
</script>
</body>
