    <style>
        :root{--primary:#007bff;--secondary:#6c757d;--light:#f8f9fa;--dark:#343a40;--success:#28a745;--danger:#dc3545;--warning:orange;--radius:8px;--font:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;--bg:var(--light);--text:var(--dark);--card:#fff;--border:#ddd;--input:#fff;--iborder:#ccc;--bot-bg:#e9ecef;--bot-text:var(--dark);--user-bg:var(--primary);--user-text:#fff;--sys-bg:#fff3cd;--sys-text:#856404;}
        body.dark-mode{--bg:#212529;--text:#f8f9fa;--card:#343a40;--border:#495057;--input:#495057;--iborder:#6c757d;--bot-bg:#495057;--bot-text:#f8f9fa;--sys-bg:#332701;--sys-text:#ffeb8f;}
        body{font-family:var(--font);margin:0;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh;transition:background .3s,color .3s;}
        .container{width:90%;max-width:800px;margin:20px auto;padding:20px;background:var(--card);border-radius:var(--radius);box-shadow:0 4px 12px rgba(0,0,0,.1);flex-grow:1;display:flex;flex-direction:column;gap:15px;}
        header{text-align:center;border-bottom:1px solid var(--border);padding-bottom:15px;}
        header h1{color:var(--primary);margin:0;font-size:1.6em;}
        header p{margin:5px 0 0;font-size:.9em;color:var(--secondary);}
        .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
        .api-key-container{display:flex;gap:8px;align-items:center;flex-grow:1;}
        .api-key-container input{padding:7px;border:1px solid var(--iborder);border-radius:var(--radius);background:var(--input);color:var(--text);flex-grow:1;}
        button{background:var(--primary);color:#fff;border:none;padding:8px 15px;border-radius:var(--radius);cursor:pointer;font-size:.9em;transition:background .2s;}
        button:hover{background:#0056b3;}
        button:disabled{background:var(--secondary)!important;opacity:.65;cursor:not-allowed;}
        #theme-btn{background:var(--secondary);}
        .toolbar-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
        .btn-export{background:var(--primary);color:#fff;border:none;padding:8px 14px;border-radius:var(--radius);cursor:pointer;font-size:.85em;transition:background .2s;}
        .btn-export:hover{background:#0056b3;}
        .pdf2-section{padding:10px;border:1px dashed var(--border);border-radius:var(--radius);}
        .pdf2-section label.title{font-size:.85em;font-weight:bold;display:block;margin-bottom:6px;color:var(--secondary);}
        .file-row{display:flex;align-items:center;gap:10px;}
        .file-row input[type=file]{display:none;}
        .file-label{background:var(--secondary);color:#fff;padding:6px 12px;border-radius:var(--radius);cursor:pointer;font-size:.85em;}
        .file-label:hover{background:#545b62;}
        #pdf2-name{font-style:italic;color:var(--secondary);font-size:.85em;}
        #pdf2-status{font-size:.85em;margin-top:4px;font-weight:bold;}
        .suggested-questions-row{display:flex;flex-direction:column;gap:6px;}
        .sq-label{font-size:.85em;font-weight:600;color:var(--secondary);}
        .questions-select{width:100%;padding:8px;border:1px solid var(--iborder);border-radius:var(--radius);background:var(--input);color:var(--text);font-size:.9em;}
        .chat-display{height:360px;overflow-y:auto;border:1px solid var(--iborder);border-radius:var(--radius);padding:10px;background:var(--bg);line-height:1.6;}
        .chat-display .user-message,.chat-display .bot-message,.chat-display .system-message{margin-bottom:10px;word-wrap:break-word;}
        .chat-display .user-message,.chat-display .bot-message{background:transparent;color:inherit;padding:0;border-radius:0;max-width:100%;text-align:inherit;margin-left:0;}
        .message{display:flex;align-items:flex-end;gap:10px;margin-bottom:4px;max-width:100%;}
        .message.user-message{flex-direction:row-reverse;justify-content:flex-start;}
        .avatar-img{width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid #eee;background-color:#f0f0f0;}
        body.dark-mode .avatar-img{border-color:#444;background-color:#555;}
        .message-bubble{padding:10px 15px;border-radius:18px;max-width:85%;word-wrap:break-word;line-height:1.5;display:flex;flex-direction:column;}
        .user-message .message-bubble.user-bubble{background:var(--user-bg);color:var(--user-text);border-bottom-right-radius:5px;margin-left:auto;}
        .bot-message .message-bubble.bot-bubble{background:var(--bot-bg);color:var(--bot-text);border-bottom-left-radius:5px;margin-right:auto;}
        .chat-display .message-bubble strong{color:var(--primary);font-size:.9em;}
        .chat-display .bot-message .message-bubble p{margin:0 0 8px;}.chat-display .bot-message .message-bubble p:last-child{margin:0;}
        .chat-display .bot-message .message-bubble pre{background:var(--dark);color:var(--light);padding:10px;border-radius:5px;overflow-x:auto;}
        .chat-display .bot-message .message-bubble code{background:rgba(0,0,0,.1);padding:2px 4px;border-radius:3px;}
        body.dark-mode .chat-display .bot-message .message-bubble code{background:rgba(255,255,255,.1);}
        .chat-display .system-message{background:var(--sys-bg);color:var(--sys-text);text-align:center;font-style:italic;font-size:.9em;padding:8px 12px;border-radius:var(--radius);}
        .chat-display .system-message.error{background:#f8d7da;color:#721c24;}
        .thinking-animation{opacity:.75;animation:pulseThink 1s ease-in-out infinite;}
        @keyframes pulseThink{50%{opacity:1}}
        .input-area{display:flex;gap:10px;}
        #question-input{flex-grow:1;padding:10px;border:1px solid var(--iborder);border-radius:var(--radius);font-size:1em;resize:none;background:var(--input);color:var(--text);}
        #send-button{background:var(--success);padding:0 20px;display:flex;align-items:center;justify-content:center;gap:8px;}
        #send-button:hover{background:#1e7e34;}
        .loader{border:3px solid #f3f3f3;border-top:3px solid var(--primary);border-radius:50%;width:16px;height:16px;animation:spin 1s linear infinite;display:none;}
        @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
        footer{text-align:center;padding:12px;background:var(--dark);color:var(--light);font-size:.8em;margin-top:20px;}
        @media(max-width:600px){.input-area{flex-direction:column;}#send-button{width:100%;padding:12px;}}
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Chatbot tutor socrático</h1>
        <p>Actividad_Normas_APA</p>
    </header>
    <div class="toolbar">
        <div class="toolbar-actions">
            <button type="button" id="new-chat-session-btn" class="btn-export">🔄 Nuevo chat</button>
            <button type="button" id="download-html-session-btn" class="btn-export">📥 Descargar HTML</button>
            <button type="button" id="download-word-session-btn" class="btn-export">📥 Descargar Word</button>
            <button type="button" id="theme-btn">🌓 Tema</button>
        </div>
    </div>
    <div class="pdf2-section">
        <label class="title">📎 Segundo PDF (opcional)</label>
        <div class="file-row">
            <label for="pdf2-upload" class="file-label">+ Seleccionar PDF</label>
            <input type="file" id="pdf2-upload" accept=".pdf">
            <span id="pdf2-name">Ningún archivo seleccionado</span>
        </div>
        <div id="pdf2-status"></div>
    </div>
    <div class="suggested-questions-row">
        <label for="questions-selector" class="sq-label">Preguntas sugeridas</label>
        <select id="questions-selector" class="questions-select" title="Elegir una pregunta propuesta">
            <option value="">— Elige una pregunta —</option>
        </select>
    </div>
    <div id="chat-display" class="chat-display"></div>
    <div class="input-area">
        <textarea id="question-input" rows="2" placeholder="Escribe tu pregunta aquí..."></textarea>
        <button id="send-button">
            <span id="send-button-text">Enviar</span>
            <div class="loader" id="loading-spinner"></div>
        </button>
    </div>
</div>
<footer><p>Diseñado por Juan Guillermo Rivera Berrío con tecnología Gemini 3.1 Pro y la IA agéntica Antigravity</p></footer>

 el   título   del   trabajo,   los   nombres   del   autor   o    de   los   autores,   la   afili ación   del   autor   (nombre   de   la   universidad),   el   nombre   del   cu rso   y    profesor/orientador   para   el   cual   se   presenta   el   trabajo.   También   se   debe   agregar   la   fecha    y   el   número   de   página.   Los   documentos   de   los   estudiantes   no   incluyen   un   encabezado   (a    menos   que   lo   s olicite   el   instructor   o   la   institución).   \n8          Portada   para   prof esionales    La   portada   de   un   trabajo   profesional   debe   incluir   el   título,   los   nombres   de   los   autores   y    sus   afiliaciones,   la   nota   del   autor,   el   encabezado   y   el   número   de   página,   como   se   muestra    en   el   siguiente   ejemplo.      \n9       Elementos   de   una   portada    Título    Un   títu lo   debe   resumir   la   idea   principal   del   manuscrito   de   manera   simple   y,   si   es   posible,    con   algo   de   estilo.   Debe   ser   una   declaración   concisa   del   tema   principal   y   debe   identificar    las   variables   o   cuest iones   teóricas   bajo   investigación   y   la   relación   entre   ellas.    Un   título   debe   ser   totalmente   explicativo   por   sí   solo.   Aunque   su   función   principal   es    informar   a   los   lectores   sobre   el   estudio,   ten   en   cuenta   que   el   título   va   a   ser   utilizado   en    otros   artículos,   así   como   será   referencia   en   bases   de   datos.   Por   lo   tanto,   un a   buena    manera   de   saber   si   describiste   bien   el   título   de   tu   artículo   es   reflexionando   si   una   persona    que   esté   buscando   el   contenido   de   tu   artículo,   ¿lo   encontrará   por   el   título   en   una   base   de    dato s?    Además,   un   buen   título   se   puede   acortar   fácilmente   y   podr á   ser   utilizado   como   el   título    abreviado   (running   head)   el   artículo   publicado.    ¿Qué   evitar   en   el   título   de   una   tesis?    Los   títulos   son   normalmente   indexados   y   compilados   en   numerosas   obras   de   referencia    y   bases   de   datos.   Por   lo   tanto,   debes   evitar   las   palabras   que   no   tienen   ningún   propósito    útil   o   que   aumentan   la   longitud   y   pueden   inducir   errores   en   los   indexadores.    Por   ejemplo,   las   palabras   método   y   resultado s   no   aparecen   normalmente   en   un   título,   así    como   no   deberían   aparecer   términos   tales   como   Un   estudio   de   o   Una   investigación    experimental   de .   Son   palabras   comunes   y   que   no   agregan   ningún   valor   al   título   de   tu    manuscrito.   Ten   en   cuenta   también   de   evitar   util izar   abreviaturas.   Utilizar   las   palabras    completas   ayuda   a   garantizar   una   indexación   precisa   y   completa   del   artículo.    ¿Cuál   es   el   tamaño   recomendado   para   el   título   de   mi   tesis?    La   longitud   recom endada   para   un   título   debe   ser   de   aproximadamente   12   palabras.    El   título   debe   escribirse   en   mayúsculas   y   minúsculas,   centrado   entre   los   márgenes    izquierdo   y   derecho,   y   posicionarse   en   la   mitad   superior   de   la   página.    Nombre   del   autor    Cada   manuscrito   incluye   el   nombre   del   autor   y   la   afiliación   institucional   del   autor   d ónde    se   realizó   la   investigación.    La   mejor   manera   de   escribir   el   nombre   de   un   autor   en   un   documento   APA   es   Primer    Nombre,   Inicial(es)   del   nombre   del   medio   y   Apellido.   Esta   forma   reduce   la   probab ilidad   \n10       de   una   identidad   errónea.   Se   recomienda   utilizar   el   mis mo   nombre   para   publicar   a   lo    largo   de   su   carrera;   es   decir,   no   cambies   la   manera   que   escribes   tu   nombre   a   cada    documento   que   publiques.    Determinar   si   Pablo   M.   Soto   es   la   misma   persona   que   P.   M.   Soto ,   P.   Soto   o   P.   Morvillo    puede   ser   difícil,   especialmente   c uando   se   cambian   la   institución   o   Universidad   dónde   se    publique   el   artículo.    Se   sugiere   también   omitir   todos   los   títulos   que   tengas   ( ej. :   Dr.,   Prof.)   así   como   los   grados    ( ej. :   PhD,   PsyD,   EdD).      Af iliación   institucional    La   afiliación   identifica   el   lugar   donde   se   encontraban   el   autor   o   los   autores   cuando   se    realizó   la   investigación.   Por   lo   general,   utilizaremos   el   nombre   de   la   Universidad.   Incluya    una   doble   afiliación   solo   si   dos   instituciones   contri buyeron   con   un   apoyo   sustancial   al    estudio.    No   incluyas   más   de   dos   afiliaciones   por   autor.   Cuando   un   autor   no   tenga   una   afiliación    institucional,   indique   la   ciudad   y   el   departamento   (estado)   de   residencia   debajo   del    nombre   del   autor.   Si   la   afiliación   institucional   ha   cambiado   desde   que   se   inició   hasta   que    se   completó   el   trabajo,   indique   la   afiliación   actual   en   la   nota   del   autor.    Los   nombres   de   los   autores   deben   aparecer   en   el   orden   de   sus   contribuciones,   centrados    entre   los   márgenes   laterale s.   La   afiliación   institucional   debe   estar   centrada   bajo   el    nombre   del   autor,   e n   la   siguiente   línea.    Caso   Ejemplo    Un   autor,   sin   afiliación   Agustina   C.   Ferrería    La   Plata,   Buenos   Aires    Dos   autores,   una   afiliación   Carolina   C.   Sánchez   y   Carlos   M.   Pedraza    Universidad   Nacional,   Bogotá,   Cundinamarca    Tres   autores,   una   afiliación   Carolina   Sánchez,   Carlos   Pedraza   y   Joaquín   Rueda    Pontificia   Formato   APA   está   compuesto   generalmente   de    las   siguientes   secciones:   Introducción ,   Método ,   Resultados   y   Discusión .    Introducción    Por   más   redundante   que   pueda   parecer,   debes   concentrarte   que   el   texto   introductorio    sea   ¡introductorio!   N o   escribas   contenido   demasiado   específico   que   no   contribuya   para   la    comprensión   fácil   de   los   lectores   del   contenido   d e   tu   investigación.   Una   manera   para    pensar   si   tu   introducción   ha   sido   clara,   es   verificar   que   has   hablado   de   manera   clara    sobre   las   pregunt as,   objetivos/hipótesis   que   forman   tu   investigación.    Método    En   esta   sección   debes   proporcionar   suficiente   información   para   permitir   a   los   lectores    comprender   cómo   se   recopilaron   y   evaluaron   los   datos   de   tu   investigación.    En   vez   de   proporcionar   detalles   completos   del   paso   a   paso   de   cada   método,   una   buena    opción   es   remitir   a   los   lectores   a   trabajos   anteriores   dónde   se   info rman   los   métodos   de    estudio   utilizados   en   tu   investigación.    Resultados    Informe   los   resultados   más   relevantes   en   esta   sección.   D ebes   evitar   omitir   datos   del    estudio   al   máximo,   aunque   en   muchas   ocasiones   es   inapropiado   informar   absolutamente    todos   los   datos .   Sea   selectivo   al   elegir   los   análisis.    Asegúrese   que   los   resultados   presentados   contribuyen   para   responder   a   sus   preguntas   o    h ipótesis   de   investigación   originales.   Si   no   quieres   dejar   esta   sección   demasiado   larga,    una   opción   es   incluir   los análisis auxiliares   en   la   sección   de   materiales    complementarios .    Discusión    Después   de   presentar   los   resultados,   es   hora   de   evaluar   e   interpret ar   sus   implicaciones,    especialmente   con   respecto   a   sus   hipótesis   originales.   Examines,   intérpretes   y   califiques    los   resultados.   S aque   conclusiones   de   ellos.   Enfatice   cualquier   consecuencia   teórica   o    práctica   de   los   resultados.    Una   sección   de   Discusión   fuer te   señala   el   área   de   consenso   y   divergencia   del   trabajo    previo,   teniendo   en   cuenta   el   tamaño   y   la   composición   de   la   muestra,   el   t amaño   del    efecto,   las   limitaciones   de   medición   y   otras   consideraciones   específicas   del   estudio.   \n15       Referencias    Todos   los   documento s   formateados   con   el   Estilo   APA   deben   tener   una   lista   de    referencias.       Notas   al   pie   o   Notas   al   final    Puedes   necesitar   utilizar   Notas   al   Pie   tanto   para   complementar   el   contenido,   como   para    hacer   atribuciones   de   derechos   de   autor.   Con   respecto   a   dónde   posi cionar   las   notas   en   un    trabajo,   ten   en   cuenta   que   la   séptima   edición   de   las   Normas   APA   permite   que   uses   tanto    Notas   al   Pie   de   Pá gina,   como   Notas   al   Final.   En   Word   encontrarás   ambas   opciones   para   \n16       formatear   tu   documento.   En   el   caso   de   que   utilices   las   Notas   al   Final   deberás   agregarla    después   de   la   lista   de   referencias   bibliográficas .    Notas   de   pie   de   página   de   contenido    Una   nota   de   contenido   debe   ser   utilizada   para   complementar   o   amplificar   algún   tipo   de    inf ormación   de   manera   sustancial   en   el   texto.   Como   la   presencia   de   notas   puede   distraer    a   los   lectores,   no   las   uses   para   incluir   exp licaciones   complejas,   tampoco   para    informaciones   irrelevantes.   Sólo   incluyas   notas   al   pie   de   página   si   fortalecen   la   discusión.    Ten   en   cuenta   que,   como   autor,   es   más   fácil   agregar   esta   discusión   en   el   texto   en   el    texto,   que   en   una   nota   al   pie.    Notas   al   pie   de   copyright    Puedes   usar   una   nota   al   pie   o   al   final   para   acreditar   permisos   referentes   a   derechos   de    autor,   es   decir,   para   ind icar   que   recibiste   permiso   de   un   editor   para   reproducir   una   cita    más   larga   que   lo   normal   o   utilizar   imágenes   protegidas   por   derec hos   de   autor.    Ten   en   cuenta   que   las   declaraciones   de   copyright   para   figuras   y   tablas   aparecen   en   las    notas   de   figura   y   tabla.   L a   obtención   del   permiso   para   citar   puede   varía   de   acuerdo   con    cada   país.    Para   obtener   ayuda   con   la   obtención   de   permisos   de   copyrig ht,   sugerimos   que   te    comuniques   con   la   Dirección   Nacional   de   Derechos   de   Autor   de   tu   país.      Notas   al   Pie   de   Página    Puedes   agreg ar   las   notas   al   pie   de   página,   es   decir,   en   parte   inferior   de   la   página   del    texto   en   la   que   aparece   la   nota.      \n17       Notas   al   Final    La   otra   opción   es   enumerar   las   notas   al   pie   en   una   página   separada.   Esta   página   debes    ubicarla   después   de   la   lista   de   referencias.       Tipo   de   fuente   e   interlineado    Notas   al   pie    La   fuente   de   la   nota   al   pie   puede   ser   más   pequeña   que   la   fuente   del   texto   (y   tener   un    interlineado   diferente).   Por   ejemplo,   si   en   tu   texto   estás   utilizando   interlineado   doble   y    fuente   Times   New   Roman,   12   pt   puedes   usar   una   la   fuente   tamaño   10   pt   con    interl ineado   sencillo.    Notas   al   final    En   este   caso,   debes   conservar   la   misma   fuente   e   int erlineado   doble   utilizado   en   el   texto.    Tablas    Todos   sabemos   que   tablas   son   elementos   compuestos   de   columnas   y   filas   dónde    presentamos   números,   texto   o   una   combinación   de   amb os.    En   esta   entrada   vamos   a   aprender   los   aspectos   básicos   de   la   configuración   de   ta bla,    incluidos   los   componentes   de   la   tabla,   dónde   agregar   bordes   y   cómo   manejar   tablas    largas   o   anchas.   Tablas   y   las   figuras   tienen   la   misma   configuración   general.    Component es   de   una   tabla    Las   tablas   en   estilo   APA   tienen   los   siguientes   componentes   básicos:   \n18       •   número   de   tabla:   el   número   de   la   tabla   (por   ejemplo,   Tabla   1)   es   lo   primero   que    aparece.   Utilice   negrita.   Numere   las   tablas   en   el   orden   en   que   se   mencionan   en    su   investigac ión.    •   título:   debes   escribir   el   título   de   la   tabla   en   una   línea   con   interlineado   dob le   y    debajo   del   número   de   la   tabla.   Utilice   un   título   breve   pero   descriptivo.   Utilice    cursiva.    •   encabezado:   las   tablas   pueden   incluir   una   variedad   de   encabezados    dependiendo   de   la   naturaleza   y   disposición   de   los   datos.   Todas   las   tablas   deben    incluir   encabez ados   de   columna.   Se   sugiere   centrar   el   texto   de   los   encabezados    de   las   columnas.    •   cuerpo:   el   cuerpo   de   la   tabla   incluye   todas   las   filas   y   columnas   de   una   tabla    (incluida   la   f ila   de   encabezados).   El   cuerpo   de   la   tabla   puede   ser   de   interlineado    sencillo,   1,5   o   doble.   Se   recomienda   centrar   el   texto   en   todas   las   celdas   de   la    tabla,   sin   embargo,   si   alinearlo   a   la   izquierda   aumenta   la   legibilidad,   no   dudes   en    alinearlo   a   la   izquierd a.    •   nota:   utilice   las   notas   para   describir   los   contenidos   de   la   tabla   que   no   pueden    entenderse   solo   con   el   título   o   con   los   mismo s datos .   Si   utilizas   abreviaturas   en    la   tabla,   puedes   especificarlas   en   las   notas,   también   puedes   utilizarla   para    atribución   de   d erechos   de   autor,   explicaciones   extras   con   asteriscos.   No   es   un    punto   obligatorio,   por   lo   tanto,   incluya   notas   de   tabla   solo   si   es   necesario.    Bordes   de   la   tabla    Debes   limitar   el   uso   de   borde   o   líneas   en   la   tabla.   En   general,   se   usa   un   borde   en   la   parte    su perior   e   inferior   de   la   tabla,   debajo   de   los   encabezados   de   columna   y   encima   de   los    totales   de   columna.   No   utilice   bordes   verticales   para   separar   los   datos,   y   no   use   bordes    alrededor   de   cada   celda   de   una   tabla.   El   espacio   entre   columnas   y   filas   y   una   aline ación    de   texto   correcta   debe   ser   suficiente   para   aclarar   las   relaciones   entre   los   e lementos   de    una   tabla.    Tipo   y   tamaño   de   fuente   e   interlineado    Use   el   mismo   tipo   y   tamaño   de   fuente   en   las   tablas   que   en   el   resto   de   tu   texto.   El   cuerpo    de   la   tabla   (celdas)   puede   tener   interlineado   sencillo,   1,5   o   interlineado   doble.   Utilice   el    interlinead o   que   haga   el   diseño   de   tabla   más   efectivo   para   la   compresión   de   la    información   presentada.   Utilice   interlineado   doble   en   el   número   de   la   tabla,   título   y    notas.   \n19       Ubicación   de   las   tablas    Hay   dos   opciones   para   la   ubicación   de   tablas   (y   figuras)   en   una   investig ación.   La   primera    es   incrustar   tablas   en   el   texto   después   de   que   la   menciones   por   primera   vez;   la   segunda    opción   es   agregar   cada   tabla   en   una   página   separada   después   de   la   lista   de   referencias .    Si   la   tabl a   es   corta,   puede   mezclar   en   la   misma   página   texto   y   la   tabla.   Intente   agregar   la    tabla   al   comienzo   o   al   final   de   la   página.   Ten   en   cuenta   que   una   tabla   también   podría    ocupa r   toda   la   página   completa   sin   problema.   Es   posible   que   tengas   que   agregar   una    línea   en   blanco   entre   la   tabla   y   el   texto   para   mejorar   la   presentación   visual.    Tablas   Largas   o   Anchas    Si   una   tabla   es   más   larga   que   una   página,   puedes   hacer   con   que   la   fila   de   encabezados   se    repita   en   la   segunda   página   y   en   las   páginas   siguientes   (cuantas   veces   sea   necesario).    Si   una   tabla   es   demasiado   ancha   para   caber   en   una   página,   puedes   utilizar   orientación    horizontal   en   la   página   con   la   tabla   ancha.    Ejemplo       Cómo   escribir   el   título   de   una   tabla    Cada   tabla   debe   tener   un   título   breve,   pero   que   sea   claro   y   ex plicativo.   El   contenido    básico   de   la   tabla   debe   ser   entendido   fácilmente   a   partir   del   título .   \n20       C itando   tablas   en   el   texto    Al   citar   una   tabla   o   una   figura   en   el   texto,   debes   hacerlo   por   su   número,   como   “Tabla   3”    o   “Figura   2”.   No   se   refiera   a   la   tabla   por   su   posición   con   respecto   al   texto   (por   ejemplo,    “la   figura   a   continuación”)   o   su   número   de   página   (por   ejemplo,   “la   tabla   en   la   página    12”).    Las   tasas   de   resp uesta   se   presentan   en   la   Tabla   1.   Los   resultados   indican   que   las   tasas   de    respuesta   para   los   c ursos   presenciales   fueron   mucho   más   altas   que   para   los   cursos   en    línea.    Figuras    Todos   los   tipos   de   elementos   visuales   que   no   sean   tablas   se   consideran   figuras   en   el    estilo   APA.   Por   ejemplo:   ilustraciones,   infografías,   fotografías,   gráficos   de   líneas   o   de    b arras,   diagramas   de   flujo,   dibujos,   mapas,   etc.   son   consideradas   figuras.   Las   tablas   y   las    figuras   tienen   la   misma   configuración   general.    ¿Debo   agregar   una   Figura   a   mi   trabajo?    El   primer   punto   que   debemos   considerar   a   la   hora   de   insertar   una   figura   en   un   t rabajo    académico   es   reflexionar   sobre   el   valor   de   la   información   de   la   figura   en   el   contexto   del    documento.   ¿La   figura   ayuda   sustancialmente   al   entendimiento   del   documento   o   de    resultados ?   ¿o   la   figura   duplica   otros   elementos   del   trabajo?   Si   la   figura   ayud a,   debemos    incluirla   en   el   trabajo,   de   lo   contrario,   no   hay   necesidad.    El   segundo   punto   para   tener   en   consideración   es:   ¿la   figura   es   la   mejor   manera   de    comunicar   la   información?   ¿o   podrías   presentarla   en   una   tabla ?    Componentes   de   una   figura    Las   figuras   de   estilo   APA   tienen   los   siguientes   componentes   básicos:    •   número   de   la   figura:   el   número   de   la   figura   (por   ejemplo,   Figura   1)   es   el   primer    ítem   que   debemos   agregar.   Se   debe   usar   negrita.   Numere   las   fig uras   en   el   orden    en   que   aparecen   en   tu   documento.    •   título:   el   título   de   la   figura   debe   aparece   una   línea   debajo   del   número   de   la    figur a.   Dé   a   cada   figura   un   título   breve   pero   descriptivo.   Utilice   cursiva   en   el    título.    •   imagen:   inserte   el   gráfico,   fotografía,   dibujo   u   otra   ilustración.    •   leyenda:   una   leyenda   de   figura   debe   colocarse   dentro   de   los   bordes   de   la   figura    y   puede   ser   usada   para   e xplicar   los   símbolos   utilizados   en   la   imagen   de   la   figura.   \n21       (Ejemplo   de   leyenda:   “los   puntos   cuadrados   representan   ganancias   y   los   puntos    redondos   pérdidas”).    •   nota:   Agregue   cualquier   contenido   que   necesites   describir   que   no   pueden    entenderse   solo   por   el   título   o   por   la   imagen   por   si   misma   (por   ejemplo,    definiciones   de   abreviaturas,   atribución   de   derechos   de   autor).   Incluya   nota s   de    figuras   solo   según   sea   necesario.    Ubicación   de   las   figuras   en   el   texto    Hay   dos   opciones   para   la   ubicación   de   figuras   (y   tabla s)   en   una   investigación.   Puedes    tanto   incrustar   cada   figura   en   el   texto   después   de   que   la   menciones   por   primera   vez   y    puede   ag regar   cada   figura   en   una   página   separada   después   de   la   lista   de   referencias ,   o    después   de   las   tablas   (si   las   hay).    Ejemplo       Cómo   citar   la   figura   en   el   texto    Las   imágenes   pueden   aparecer   incrustadas   en   el   texto   o   al   final   en   un   listado   de   Figuras.    Si   las   incrustas   en   el   texto   debes   hacerlo,   idealmente,   después   de   ser   referidas.   Es   decir,    primero   se   hace   el   comentario   refiriéndose   a   la   imagen   por   su   número   y   luego   se   añade    la   figura   al   texto.   \n22       Ejemplo    Como   podemos   ver   en   la   Figura   1,   el   dólar   ha   perdido   su   valor   debido   a   la   infl ación   al    largo   del   tiempo.   Por   otro   lado,   el   oro   ha   mantenido   su   poder   de   compra.       Cómo   referenciar   una   imagen,   fotografía   o   g ráfico    Si   está   adaptando   o   reproduciendo   una   tabla   o   figura   que   fue   publicada   originalmente    por   otra   persona,   deberás   proporcionar   una ormes   detallados   y   /   o   complejos   sugeridos   en   la   sección    de   estándares   de   informes   de   este   capítulo .    Si   su   manuscrito   tiene   solo   un   apéndice,   márquelo   como   Apéndice;   Si   su   manuscrit o   tiene    más   de   un   apéndice,   etiquete   cada   uno   con   una   le tra   mayúscula   (Apéndice   A,   Apéndice    B,   etc.)   en   el   orden   en   que   se   menciona   en   el   texto   principal.   Cada   apéndice   debe   tener    un   título.   En   el   texto,   consulte   los   apéndices   por   sus   etiquetas.   \n24       Ubicación   del   apéndice   en   la   estructura   del   documento    •   Un   apéndice   es   apropiado   para   materiales   que   son   relativamente   breves   y   que    se   presentan   fácilmente   en   formato   impreso.    •   Si   un   documento   tiene   un   apéndice,   etiquételo   como   “Apéndice”;    •   Si   un   documento   tiene   más   de   un   apéndice,   etiquete   cada   apéndice   con   una    letra   mayúsc ula   (por   ejemplo,   “Apéndice   A”,   “Apéndice   B”)   en   el   orden   en   que    está   mencionado   en   el   texto.    •   Comience   cada   apéndice   en   una   página   separada   después   de   las   Referencias ,    Notas   al   final ,   Tablas   y   Figuras .    •   El   apéndice   puede   con sistir   en   texto,   tablas,   figuras   o   una   combinación   de   es tos.    Si   tiene   dificultades   para   decidir   qué   debería   aparecer   en   el   texto   del   cuerpo   versus   en   un    apéndice,   piense   si   su   lector   encontrará   o   no   la   información   crítica   para   comprender   su    discusión,   o   si   la   información   es   complementaria.   En   otras   palabras,   ¿e s   la   información    “necesita   saber”   o   “es   bueno   saberlo”?   Si   es   “necesita   saber”,   inclúyalo   en   el   texto   de   su    cuerpo;   si   es   “bueno   saberlo”,   un   apéndice   es   probablemente   un   buen   hogar   para   la    informació n.   Si   no   está   seguro,   consulte   con   su   profesor   o   supervi sor.    Ejemplo   apéndice   en   Formato   APA    Apéndice   A.   Lista   de   Materiales    Según   la   teoría   del   paseo   aleatorio,   los   movimientos   de   los   mercados   financieros   sí   se    pueden   predecir.   En   la   realidad,   se   puede   ob servar   un   mayor   o   menor   grado   de   este    hecho   (debido   a   ineficiencias   del   mercado   como:   información   privilegiada,   pánicos   o    com portamientos   irracionales),   por   lo   que   se   puede   decir   que   los   mercados   tienen   un    comportamiento   débil,   semi - fuerte   o   fuerte.    Apéndi ce   B.   Lista   de   Entrevistados    Según   la   teoría   del   paseo   aleatorio,   los   movimientos   de   los   mercados   financieros   sí   se    pueden   pr edecir.   En   la   realidad,   se   puede   observar   un   mayor   o   menor   grado   de   este    hecho   (debido   a   ineficiencias   del   mercado   como:   informació n   privilegiada,   pánicos   o    comportamientos   irracionales),   por   lo   que   se   puede   decir   que   los   mercados   tienen   un    comportamiento   débil,   semi - fuerte   o   fuerte.       Tablas   y   Figuras   en   el   Apéndice    Al   igual   que   el   texto   principal,   un   apéndice   puede   incluir   títulos   y   subtítulos ,   así   como    tablas   y   figuras .   Debes   numerar   cada   tabla   y   figu ra   del   apéndice   si   es   necesario   para   una   \n25       referencia   posterior;   utilice   el   número   de   tabla   junto   con   la   letra   del   apéndice   en   el   que    está   incluido   la   tabla   (por   ejemplo,   Tabla   A1).    Si   tienes   un   único   apéndice   en   tu   texto   y,   por   lo   tanto,   no   está   etiquetado   con   una   letra,    preceda   todas   las   tablas   y   figuras   con   la   letra   A   para   distinguirlos   de   las   tablas   y   figuras    del   texto   princip al.   Todas   las   tablas   y   figuras   del   apéndice   deben   ser   citadas   dentro   del    apéndice   y   numeradas   en   orden   de   aparición.    Si   un   apéndice   es   constituido   de   apenas   una   tabla,   no   es   necesario   numerar   la   tabla   por    separado.   El   título   del   apéndice   centrado   sirve   en   lugar   de   un   número   y   título   de   tabla.   Si    son   varias   tablas,   trate   cada   tabla   como   un   apéndice   separado.   Si   combinas   varias   tablas    ( pero   no   texto)   en   un   apéndice,   numere   las   tablas.    Comience   cada   apéndice   en   una   página   separada.   Centre   la   palabra   Apéndice   y   las   letras    mayúsculas   de   identificación   (A,   B,   etc.,   en   el   orden   en   que   se   mencionan   en   el   texto)   en    la   parte   superior   de   la   págin a.        \n26       Formato    Tamaño   de   papel    La   configuración   del   tamaño   de   página   en   Word   debe   ser   Tamaño   Carta,   que   tiene   las    medidas   de   21.59   cm   x   27.94   cm   (equivalente   a   8   1/2   x   11   pulgadas ).    Márgenes    El   tamaño   de   los   márgenes   en   formato   APA   debe   ser   de   2.54   cm   (equiv alente   a   1    pulgada)   de   todos   los   lados.   Es   decir,   debes   aplicar   un   margen   de   2,54   cm   a   la   margen    superior,   inferior,   derech a   e   izquierda.    Tipo   y   tamaño   de   fuente    Sin   serifas    •   Calibri   de   11   puntos;    •   Arial   de   11   puntos;    •   Lucida   Sans   Unicode   de   10   puntos    Con   ser ifas    •   Times   New   Roman   de   12   puntos;    •   Georgia   de   11   puntos;    •   Computer   Modern   normal   de   10   puntos   (la   fuente   predeterminada   en    LaTeX)       Todas   estas   fuentes   son   legibles   y   están   ampliamente   disponibles   e   incluyen   caracteres    especiales   como   símbolos   matemático   página   de   un   trabajo   profesional   en   formato   APA.   Es   un   título   breve   y   sirve   pa ra    identificar   el   tema   para   el   lector   de   una   manera   rápida.    Alg unas   características   del   título   abreviado:    •   longitud   máxima   de   50   caracteres   (incluyendo   espacios   y   signos   de   puntuación).    Si   el   título   de   tu   trabajo   tiene   más   de   50   caracteres   debes   utilizar   un a   versión    resumida   del   título   para   el   encabezado.    •   el   título   deb e   estar   escrito   todo   en   MAYÚSCULAS    •   ya   no   debes   utilizar   el   término   Título   corto   o   Running   Head   (actualización   de   la    séptima   edición   de   APA)    •   el   título   corto   aparece   en   el   mismo   formato   en   todas   las   páginas   de   un   trabajo    profesional,   incluida   portada.    •   debe   s er   alineado   a   la   izquierda    •   en   el   encabezado   también   se   debe   agregar   la   numeración   de   página   a   la   derecha    Títulos   y   Subtítulos    Los   títulos   y   subtítulos   ayudan   a   que   lectores   encuentren   los   punto s   clave   de   un    documento.   En   el   estilo   de   Normas   APA   se   recomien da   el   uso   de   hasta   5   niveles   de    títulos   y   subtítulos.   Cada   nivel   cuenta   con   un   formato   propio.    La   7ma   (séptima)   edición   de   las   Normas   APA   trae   cambios   en   como   los   títulos   de   los    documentos   debe n   ser   presentados.   Debes   utilizar   el   mismo   tamaño   de   fuente   que   uses    en   todo   el   documento.    Jerarquía   de   títulos   APA    Abajo   podrás   ver   cómo   cada   nivel   de   título   y   subtítulo   debe   ser   conf igurado.   Nota   que   en    la   séptima   edición,   todos   los   niveles   de   t ítulo   van   en   negrita   y   todos   van   con   cada    palabra   del   título   iniciando   en   mayúscula   ( Capitalización   de   Títulos ).   \n29       N i vel   Formato    Nivel   1   Centrado   •   Negrita   •   Cada   Palabra   Iniciando   en   Ma yúscula    Texto   inicia   en   nuevo   párrafo    Nivel   2   Alineado   a   la   izquierda   •   Negrita   •   Cada   Palabra   Iniciando   en    Mayúscula    Texto   inicia   en   nuevo   párrafo    Nivel   3   Alineado   a   la   izquierda   •   Negrita   •   Cursiva   •   Cada   Palabra    Iniciando   en   Mayúscula    Texto   inicia   en   nuevo   párrafo    Nivel   4   Alineado   a   la   izquierda   •   Negrita   •   Cada   Palabra   Iniciando   en    Mayúscula   •   Con   sangría   de   ½   pulgada   (1.27   cm)   •   Con   punto   final.    Texto   inicia   en   la   misma   línea    N ivel   5   Alineado   a   la   izquierda   •   Negrita   •   Cursiva   •   Cada   Palabra    Inicia ndo   en   Mayúscula   •   Con   sangría   de   ½   pulgada   (1.27   cm)   •    Con   punto   final.   Texto   inicia   en   la   misma   línea    Debes   utilizar   los   niveles   de   títulos   consecutivamente.   Si   tu   documento   cuenta   con   hasta    tres   niveles   de   títulos,   entonces   debes   utilizar   los   tres   prim eros   estilos   de   encabezados    mostrados   en   la   tabla   anterior.    Atención    •   Evite   tener   solo   un   subtítulo   debajo   de   un   nivel ;    •   No   etiquete   los   títulos   y   subtítulos   con   números   o   letras;    •   Los   títulos   y   subtítulos   deben   tener   interlineado   doble;    Ejemplo   de   títulos   y   subtítulo   APA    Para   que   el   ejemplo   anterior   quede   más   claro,   vea   un   ejemplo   real   de   títulos   abajo    utilizando   la   versión   más   actualizada   de   APA.   \n30             Interlineado   de   párrafo    Como   regla   general   siempre   utilizaremos   interlineado   doble ,   incluyendo   el   resumen,    tex to   de   citas   de   más   de   40   palabras ,   números   de   tablas   y   figuras,   títulos   y   subtítulos   y    en   la   lista   de   referencias .   No   debes   agregar   un   espacio   adicional   de   párrafo   antes   o    después   de   los   párrafos .   Tampoco   debes   realizar   saltos   de   línea   extras   entre   párrafos   o    entre   títulos   y   subtítulos.    Excepciones    Las   excepciones   al   doble   espacio   (o   al   salto   adicional   de   párrafo )   entre   líneas   son   las    siguientes:   \n31       Portada:   inserte   una   línea   extra   en   blanco   a   doble   espacio   entre   el   título   de   la    investigación   y   los   datos   del   autor   en   la   portada .   Cuando   agregues   la   nota   del   autor,    incluya   también   al   menos   una   línea   en   blanco   extra   a   doble   espacio   antes   de   la   nota   del    autor.    Tablas:   en   el   cu erpo   de   la   tabla   puede   utilizar   interlineado   sencillo,   1,5   o   doble.   Elija   el    que   sea   más   ef ectivo   para   tu   trabajo.   Sin   embargo,   sigas   utilizando   doble   espacio   en   el    número   de   la   tabla,   título   y   notas.    Figuras:   el   texto   dentro   de   una   imagen   o   de   una   figura   pueden   ser   interlineado   sencillo,    1,5   o   doble.   Elija   el   que   sea   más   efectivo   para   la   inform ación   que   quieras   mostrar.   Al   igual    que   en   las   tablas,   utilices   interlineado   doble   en   el   número   de   figura,   título   y   notas.    Notas   al   pie   de   página:   Puedes   utilizar   interlineado   sencillo   y   una   fuente   ligeramente    más   pequeña   que   el   texto.   Por   ejemplo,   si   utili zas   Times   New   Roman,   12   en   el   texto,   en    las   notas   al   pie   de   página,   podrás   utilizar   Times   New   Roman,   10.    Ecuaciones   matemáticas:   en   estos   casos   es   permitido   aplicar   un   interlineado   triple   o    cuádruple.   Ajuste   al   valor   que   deje   la   ecuación   visible.    Alineació n   de   párrafo    Utilices   alineación   a   la   izquierda   en   todo   el   documento.   Es   decir,   el   margen   derecho    quedará   “irregular”.   No   utilices   justificación   de   texto,   al   menos   q ue   tu   universidad   te    solicite   lo   contrario.         \n32       Separación   de   sílabas    No   inserte   guiones   aut omáticos,   ni   saltos   manuales   en   tu   investigación.   Es   aceptable    separar   enlaces   largos   (como   en   un   DOI   o   URL   en   una   entrada   de   la   lista   de   referencias,    pero   asegúrate   que   los   enlaces   queden   funcionando)    Sangría   de   párrafo    La   primera   línea   de   cada   párrafo   de l   texto   debe   tener   un   sangrado   de   ½   pulg.   (1,27   cm)    desde   el   margen   izquierdo.   Puedes   utilizar   la   tecla   Tab   o,   idealmente,   configurar   el   estilo    de   párrafos   de   en   Wor d   para   lograr   la   sangría.   Jamás   utilices   la   barra   de   espacios   para    conseguir   este   efecto.       Excepciones   de   alineado   y   sangría   de   párrafo    •   portada:   el   título   y   las   afiliaciones   deben   estar   centrados.    •   títulos   y   subtítulos:   algunos   niveles   de   títulos   y   subtítulos   tienen   alineación    diferente.   El   título   de   nivel   1   debe   estar   centrado,   los   subtítulos   de   nivel   2   y   3    deben   estar   alineados   a   la   izquierda   (sin   sangrado)   y   los   títulos   de   los   niveles   4   y    5   están   sangrados   como   los   párrafos   regulares.    •   secciones   del   documento:   Los   títulos   de   l as   secciones   ( Resumen ,   Referencias ,    Apéndice ,   Tablas ,   Figuras )   deben   estar   centrados.    •   resumen/abstract:   la   primera   línea   del   primer   párrafo   del   resumen   debe    quedar   sin   sangría.    •   citas   en   bloque:   las   citas   en   bloque   (citas   con   más   de   4 0   palabras),   deben    utilizar   una   sangría   de   ½   pulg.   (1,27   cm)   desde   el   margen   izquierdo.   Si   la   cita   en    bloque   tiene   más   de   un   párrafo,   la   primera   línea   del   segundo   párrafo ,   así   como    los   párrafos   posteriores   deben   sangrarse   más   ½   pulg.   (1,27   cm).   De   modo   que   la    primera   línea   tenga   una   sangría   total   de   1   pulg.   (2.54   cm).    •   tablas   y   figuras:   los   números   de   tabla   y   figura,   los   títulos   de   tablas   y   figuras,    así   como   las   notas   deben   q uedar   alineados   a   la   izquierda   (sin   sangría).   \n33       •   lista   de   referencias:   las   entradas   de   la   lista   de   referencias   bibliográficas   deben    tener   una   sangría   francesa   de   ½   pulg.   (1,27   cm).    •   apéndice:   las   etiquetas   y   títulos   de   los   apéndices   deben   estar   centrados.        \n34       Citas   Cada   vez   que   utilices   ideas   de   otros   autores,   deberás   dar   crédito   a   estas   ideas.   El   acto   de    acreditar   estas   palabras   es   conocido   como   Citas .    Entonces   “Citar   algo”   significa   dar   crédito   a   una   idea,   pen s amiento   o   frase.   Por   ejemplo,    si   agregas   una   frase   de   alguien   reconocido   en   tu   campo   de   investigación   debes   citar   el    autor   original.   Si   no   realizas   las   citas   correctamente   podrás   ser   acusado   de   plagio ,   lo   que    puede   tener   consecuencias,   tanto   aca démicas,   como   jurídicas.    ¿Qué   sistema   de   cita   utiliza   las   Normas   APA?    Las   Normas   APA   utilizan   el   método   de   citas   Autor - Fecha .   Esto   significa   que,   a   cada   cita,    deberás   informar   el   apellido   del   autor   y   el   año   de   publicación   de   la   fuente.   Y   una    referencia   com pleta   debe   aparecer   en   la   lista   de   referencias   bibliográficas   al   final   de   tu    texto.   Existen   otras   metodologías   de   citas   que   puedes   conocer   en   otras   normas   de   estilo .    ¡IMPORTANTE!   Todas   las   fuentes   que   se   citan   en   el   texto   deben   aparecer   en   la   lista   de    referencias   al   final   del   documento.    Ejemplo       ¿Q ué   t ipos   de   cita   existen   en   el   Formato   APA?    El   estilo   APA   separa   las   citas   en   dos   grandes   clases:   citas   textuales   y   citas   parafraseadas.    Citas   textuales    Son   consideradas   citas   textuales ,   dónde   repr odu c es   exactamente   las   palabras   del   autor.    Y   de   acuerdo   con   el   tamaño,   se   cambia   el   formato   de   presentación.   Citas   de   más   de   40    palabras   se   muestran   de   una   manera   en   el   texto   y   citas   de   hasta   40   palabras   se    muestran   de   otra   manera.   \n35       Citas   parafraseadas    Son   consideradas   citas   parafraseadas   cuando   cu e ntas,   en   tus   propias   palabras,   las   ideas    de   otro   autor.   Cada   vez   que   parafrasee   a   otro   autor   (es   decir,   resuma   un   pasaje   o    reorganice   el   orden   de   una   oración   y   cambie   algunas   de   las   palabras),   también   debes    acreditar   la   fuente   en   el   texto.    Citas   narrat iva s   o   citas   en   paréntesis    Existen   dos   formatos   básicos   para   presentar   las   citas   en   el   texto.   Puedes   presentar   la   cita    de   manera   narrativa   o   en   paréntesis   después   de   la   cita.   En   algunos   libros   sobre   Normas    APA   en   español   esto   está   especificado   como   cita   ba sad a   en   el   texto   y   cita   basada   en   el    autor .   En   inglés,   el   término   original   utilizado   por   APA   es   Narrative   Citation   o    Parenthetical   Citation .    Cita   narrativa   (basada   en   el   autor)    Este   tipo   de   cita   es   conocida   como   basada   en   el   autor,   porque   al   comienzo   de   la   fr a se    vamos   a   agregar   el   nombre   del   autor.   En   las   citas   narrativas,   el   nombre   del   autor   se    incorpora   al   texto   como   parte   de   la   oración   y   el   año   sigue   entre   paréntesis.    Ejemplo    En   este   exacto   momento,   las   partículas   que   habían   sido   aceleradas   pasan    inmediatam ente   a   otro   estado   del   alma.   Berrío   (2019)   afirma   que   “esto   es   la   prueba    cabal   de   la   existencia   divina   y   de   la   presencia   de   un   ser   más   poderoso   entre   nosotros”   (p.    87).    Cita   en   paréntesis/parentética   (basada   en   el   texto)    En   las   citas   entr e   paréntesis,   el   n ombre   del   autor   y   la   fecha   de   publicación   aparecen   entre    paréntesis.    Ejemplo    “La   aceleración   de   las   partículas   y   su   posterior   calma   es   la   prueba   cabal   de   la   existencia    divina   y   de   la   presencia   de   un   ser   más   poderoso   entre   nosotros”   (Berrí o,   2019,   p.   87).    O tras   maneras   válidas   de   redactar   una   cita    Uno   de   los   objetivos   de   este   blog   es   transmitir   que   para   seguir   las   Normas   APA   no   es    necesario   restringir   su   creatividad   como   escritor.   La   mayoría   de   los   ejemplos   de   estilo    ilustrados   en   los   manuales   APA   muestran   s olo   uno   o   dos   ejemplos   de   citas   (que   suele n    ser   los   ejemplos   anteriores).   Sin   embargo,   puedes   escribir   una   oración   de   varias   maneras    y   aun   así   estar   cumpliendo   con   las   Normas   APA.   Todas   las   siguientes   citas   abajo   son   \n36       válidas.   Siempre   que   vayamos   a   citar   de bemos   informar   autor,   el   año   y   número   de    p ágina.    En   casos   raros   (como   en   el   ejemplo   2),   el   autor   y   la   fecha   pueden   aparecer   en   la    narración.   En   este   caso,   no   use   paréntesis.    Ejemplo   1    De   acuerdo   a   Sánchez   (1994),   “el   planeta   es   azul”   (p.   147).       Ejemplo   2    E n   1994,   Sánchez   ha   concluido   que   “el   plane ta   es   azul”   (p.   147).       Ejemplo   3    De   hecho,   “el   planeta   es   azul”   (Sánchez,   1994,   p.   147).       Ejemplo   4    “El   planeta   es   azul”   de   acuerdo   a   Sánchez   (1994,   p.   147)   y   todo   el   universo...       Ejemplo   5    Los   resultados   de   Sánchez   (1994)   indican   que   “el   planeta   es   azul”   (p .   147).    Recomendaciones    •   Revise   bien   que   el   nombre   de   los   autores   en   las   citas   coincida   con   el   nombre   de    los   autores   en   la   lista   de   referencias.   Todos   los   autores   en   la   lista   de   referencias    deben   haber   sido   citados   en   el   texto,   sea   textualmente   o   de   manera   parafraseada.    •   Asegúrese   de   citar   siempre   las   fuentes   primarias .   Es   decir,   si   encontraste   en   libro    A   una   cita   al   libro   B,   debes   buscar   esta   información   directamente   en   el   libro   B   y    citarlo.   Algunas   veces   es   imposib l e   encontrar   la   obra   original.   En   estos   ca sos,    puedes   citar   las   fuentes   secundarias   (pero   hazlo   con   moderación).    •   Incluso   cuando   no   se   pueda   recuperar   la   fuente   (por   ejemplo,   si   quieres   citar   un    correo   electrónico   –   los   lectores   no   podrán   acceder   a   tu   corre o   electrónico),   aun    así,   debes   acreditar   al   autor   en   el   texto   como   una   comunicación   personal.   Hazlo    con   moderación.    •   Evite   tanto   la   subcitar   (pocas   citas)   como   sobrecitar   (muchas   citas).   La   subcitación    muchas   veces   puede   conducir   al   plagio   y/o   al   autoplagio .   La   sobrecitación   es    innecesaria   y   puede   ser   una   distracción   al   lector.   Un    vimos   cómo   escribir   una   cita   para   un   sólo   autor,   pero   a   veces   hay   casos   dónde   hay   citas    con   más   de   un   autor .    Cómo   citar   textos   del   mismo   a utor   y   el   mismo   año    Muchas   veces   nos   profundamos   tanto   en   la   obra   de   un   autor   que   lo   citamos   más   de   una    vez   en   el   mismo   trabajo.   Y   muchas   veces   el   autor   ha   publicado   los   libros   en   el   mismo    año.   Supongamos   el   caso   de   un   autor   llamado   Sánc h ez   que   ha   publicad o   el   libro   A   en   \n38       enero   de   1990   y   el   libro   B   en   agosto   de   1990.   A   la   hora   de   citarlo   en   el   texto   tendríamos,    para   ambos   los   caso,   una   cita   del   tipo   (Sánchez,   1990),   pero   ¿ cómo   podemos   hacer   con    que   el   lector   distinga   a   que   libro   estamos   ha c iendo   referencia?   Para   eso,   hemos   creado    una   sección   dónde   enseñamos   citar   obras   de   un   mismo   autor   editadas   en   un   mismo   año .    Citas   secundarias    Tratamos   de   utilizar   siempre   una   fuente   primaria   al   citar.   Una   fuente   primaria   es   dónde    se   encuentra   el   contenido   original.   Una   fuente   secundaria   se   refiere   al   contenido   original    informado   en   otra   fuente.   Si   es   posible   encuentre   la   fuente   primaria,   léala   y   cítela    dir e ctamente   en   lugar   de   citar   una   fuente   secundaria.   Utilice   las   citas   secundarias   cuando    el   trabajo   original   está   agotado,   no   está   disponible   o   solo   está   disponible   en   un   idioma    extranjero.    Siga   estas   instrucciones   cuando   cite   una   fuente   secundaria:    •   En   la   l i sta   de   referencias,   proporcione   una   entrada   para   la   fuente   secundaria   que    utilizó.    •   En   el   texto,   identifique   la   fuente   primaria   y   escriba   “como   se   citó   en”   y   apunte   la    fuente   secundaria.    •   Si   se   conoce   el   año   de   publicación   de   la   fuente   primaria,   inclúyalo   t a mbién   e n   la    cita   del   texto.    Por   ejemplo,   si   lees   un   trabajo   de   Sánchez   (2009)   en   el   que   se   citó   a   Ayala   (1983),   y   no    pudiste   leer   el   trabajo   de   Ayala,   cite   el   trabajo   de   Ayala   como   la   fuente   original,   seguido    del   trabajo   de   Sánchez.   Solo   el   trabajo   de   Sánc hez   deb e   aparecer   en   la   lista   de    referencias.    Cita   en   paréntesis    (Ayala,   1983,   como   se   citó   en   Sánchez,   2009)       Cita   narrativa    Ayala   (1983,   como   se   citó   en   Sánchez,   2009)   afirma   que   no   todas   las   estrellas   que   brillan    hoy   brillarán   mañana.    Citando   comunica c iones   p ersonales    Son   consideradas   comunicaciones   personales   cartas   privadas,   comunicaciones    electrónicas   (como   el   e - mail   o   mensajes   de   grupos   de   WhatsApp ),   entrevistas    persona l es,   con versaciones   telefónicas   y   similares.   \n39       Como   estos   datos,   por   lo   general   no   son   recuperables,   las   comunicaciones   personales   no    se   incluyen   en   la   lista   de   referencias .   Cite   las   comunicaciones   personal e s   solo   en   texto,    proporcione   las   iniciales,   así   como   el   apellido   del   comunicador,   y   proporcione   una   fecha   lo    más   exacta   posible:    Ejemplo    “ Serias   medidas   han   sido   tomadas   por   la   alcaldía   para   prevenir   el   suicidio   de    adolescentes.”   (Marri,   J.,   comunicación   p ersonal,   28   de   septiembre   de   1998).    Use   su   sentido   común   al   citar   comunicaciones   personales   de   foros,   grupos   públicos,   etc.    Existen   un   sin   fin   de   foros   informales   para   comunicarse,   y   lo   que   citas   en   tu   artículo   debe    tener   relevancia   académica.    Citas   Parafr aseadas    En   la   cita   de   parafraseo   se   utilizan   las   ideas   de   un   autor,   pero   en   palabras   propias   del    escritor.   Una   paráfrasis   reafirma   la   idea   de   otro   autor   en   tus   propias   palabras.    Parafrasear   te   permite   resumir   y   sintetizar   información   de   una   o   más   fuentes,   enfocars e    en   información   significativa,   comparar   y   contrastar   detalles   relevantes.   Ten   en   cuenta    que,   en   algunos   casos,   podrías   estar   citando   tu   propia   idea   publicada   anteriormente   en    otro   trabajo   –   evite   el   autoplagio .    Es   común   que   autores   consagrados   parafraseen   sus   fuentes   la   mayor   parte   del   tiempo,    en   lugar   de   citarlas   directamente.   Es   aconsejable   que,   como   autor,   ejercite   la   práctica   de    parafrasear.   Muchas   veces   las   citas   directas ,   especialmente   las   largas,   son   vistas   por   los    profesores   como   una   manera   que   el   estudiante   encontró   para   aumentar   el   texto   del    trabajo   sin   desarrollar   ideas   propias.    Cuando   parafrasees ,   debes   citar   el   t rabajo   original,   sea   utilizando   el   modelo   de   cita    narrativa   o   de   cita   entre   paréntesis .    ¿Debo   incluir   el   número   de   página?    Siempre   debes   incluir   el   apellido   del   auto r   y   el   año   de   publ icación.   Es   recomendado,   pero    no   obligatorio   como   en   la   cita   directa ,   que   proporciones   el   número   de   página   (o   párrafo    para   materiales   no   paginados ),   especialmente   cuando   quieras   ayudar   a   un   lector    interesado   en   profund izar   su   lectura,   a   ubicar   el   pasaje   relevante   en   un   texto   largo   o    complejo.    Abajo   puedes   ver   algunos   ejemplos   de   cómo   utilizar   el   sistema   autor - data   al   parafrasear    un   autor   \n40       Ejemplo    El   índice   de   muertes   violentas   durante   el   siglo   XXI   ha   aumentado   de   manera   exponencial    (Ramírez,   1983).    Ejemplo    Según   Taleb   (2016)   el   crac   bancario   del   2018   fue   por   cuenta   de   una   acumulación   de    riesgos   ocultos   y   asimétr icos   y   que   los   banqueros   estaban   empeñados   en   búsqueda   de    rentas   (pp.   30 – 31).    Una   paráfrasis   larga    Una   paráfrasis   puede   ser   de   varias   oraciones.   En   tales   casos,   cite   el   trabajo   que   se    parafrasea   en   la   primera   mención.   Una   vez   que   el   traba jo   ha   sido   citado,   no   es   necesario    repetir   la   cita   siempre   que   el   contexto   de   la   escritura   deje   en   claro   que   el   mismo   trabajo    continúa   parafraseado.    Según   Taleb   (2019)   el   crac   bancario   del   2018   fue   por   cuenta   de   una   acumulación   de    riesgos   ocultos   y   asimétr icos   y   que   los   ban queros   estaban   empeñados   en   búsqueda   de    rentas.   Además,   encontró   que   la   elección   de   Donald   Trump   era   obvia   ya,   dijera   lo   que    dijera,   se   presentaba   al   público   como   una   persona   verdadera,   al   contrario,   de   los   otros    candidatos.    Más   de   una   ob ra   en   la   misma   par áfrasis    Si   la   paráfrasis   incorpora   múltiples   fuentes   o   cambia   entre   fuentes,   repita   la   cita   para   que    la   fuente   sea   clara.    Varios   economistas   han   encontrado   que   entre   los   motivos   del   crac   del   2008   estuvo   el    exceso   de   apalancamiento   de   los   bancos   (Taleb,   201 9),   el   crédito   subprime   (Sánchez   et    al.,   2020)   y   que   estos   dos   factores   han   llevado   a   la   formación   de   una   burbuja   inmobiliaria    d urante   décadas   (Ayala   y   Masiero,   2010;   Taleb,   2019).   Todos   estos   factores   han   causado    la   peor   caída   de   la   bolsa   americana   en   los   últimos   50   años   y   más   de   diez   bancos   tuvieron    que   ser   rescatados   por   el   banco   central   americano   (Ayala   y   Masiero,   2010;   Sánchez   et   al.,    2020;   Taleb,   2019;).    Cita   Textual   o   Directa    Una   cita   es   textual   o   directa   cuando   se   reproduce   palabra   por   palabra   direc tamente   de    un   texto   de   un   otro   autor,   o   incluso   de   su   propio   texto   ya   escrito   en   otra   publicación.    Siempre   que   realices   una   cita   directa   debes   informar,   además   del   autor   y   año   y   la   página   \n41       específica   (ver   detalles   para   casos   de   material   sin   paginación )   y   debes   incluir   la   referencia    completa   en   la   lista   de   referencias   de   tu   trabajo.    Como   sugerencia   general,   es   mejor   pa rafrasear   las   fuentes,   en   lugar   de   citarlas    directamente   porque   la   paráfras is   te   permite   ajustar   el   material   ya   escrito   al   c ontexto   de    su   artículo   a   tu   estilo   de   escritura.   Sin   embargo,   algunas   veces   es   conveniente   realizar    una   cita   textual.   Algunos   ca sos   son:    •   cuando   un   autor   ha   dicho   algo   memorable   o   sucinto;   y    •   cuando   quieras   reproducir   o   responder   una   definición   exacta   de   alg una   idea    Ten   en   cuenta   que   algunos   profesores   pueden   establecer   límites   en   el   uso   de   citas    directas.   Este   recurso,   muchas   veces,   era   utilizado   por   los   estudiantes   para   hacer   con   que    su   trabajo   parezca   más   largo   y   algunos   profesores   tienen   como   hábito   penal izar   esta    práctica .   Recomendamos   que   consultes   con   tu   orientador   este   punto.    Ejemplo   de   cita   textual   corta    Si   la   cita   tiene   menos   de   40   palabras ,   incorpórela   en   el   texto   y   encierre   la   cita   con    comillas   dobles.   Si   la   cita   aparece   en   la   mitad   de   una   oración   en   tu   texto,   finalice   el   pasaje    con   comillas,   cite   l a   f uente   entre   paréntesis   inmediatamente   después   de   las   comillas   y    continúe   la   oración.   No   es   necesario   utilizar   ninguna   otra   p untación   si   la   frase   no   lo    requiere.    Cita   narrativa   (énfasis   en   el   autor)    Analizando   la   crisis   financiera   del   2008,   Lynch   (2012)   afi rma   que   “la   crisis   ha   sido    motivada   por   lo   que   hay   de   más   perverso   en   el   mundo   capitalista”   (p.   127),    contribuyendo   a   un   cli ma   general   de   negatividad   con   los   partidos   de   derecha.       Cita   entre   paréntesis   (énfasis   en   la   cita)    Varios   economistas   han   afirma do   e n   la   crisis   financiera   del   2008   que   “la   crisis   ha   sido    motivada   por   lo   que   hay   de   más   perverso   en   el   mundo   capitalista”   (Lynch,   2012,   p.   127)   lo    que   ha   contribuido   para   un   malestar   con   los   partidos   de   derecha   por   el   mundo.    Si   la   cita   aparece   al   final   d e   un a   oración ,   cierre   el   pasaje   citado   con   comillas,   cite   la    fuente   entre   paréntesis   inmediatamente   después   de   las   comillas   y   termine   con   un   punto    fuera   del   paréntesis   final.    Se   ha   afirmado   en   quiebra   de   Wall   Street   en   el   2008   que   “l a   crisis   ha   sido   motiva da   p or    lo   que   hay   de   más   perverso   en   el   mundo   capitalista”   (Lynch,   2012,   p.   127).      \n42       Citas   con   menos   de   40   palabras    Cuando   la   cita   tiene   menos   de   40   palabras   se   escribe   inmersa   en   el   texto,   entre   comillas    y   sin   cursiva.    En   caso   de   que   la   cita   se   encuentre   en   med io   de   una   oración ,   luego   de   cerrarla   con   las    comillas,   anote   inmediatamente   la   fuente   entre   paréntesis   y   continúe   con   la   oración.   No    emplee   ningún   otro   signo   de   puntuación   después   de   los   paréntesis,   a   menos   que   la    oración   lo   requ iera.    Ejemplo   cita   cort a   na rrativa       Si   la   cita   aparece   al   final   de   una   oración ,   cierre   el   pasaje   citado   con   comillas,   cite   la   fuente    entre   paréntesis   inmediatamente   después   de   las   comillas,   y   termine   con   un   punto   u   otra    puntuación   fuera   del   paréntesis   fin al.    Ejemplo   cita   corta   entr e   paréntesis       Debes   tener   atención   ya   que   existen   cambios   en   cómo   formatear   las   citas   con   más   de   40    palabras .   \n43       Citas   con   más   de   40   palabras    Las   citas   de   más   de   40   palabras   se   es crib en   aparte   del   texto,   con   sangría,   sin   comillas,   sin    cursiva   y   con   interlineado   doble.   Al   final   de   la   cita   se   coloca   el   punto   antes   de   los   datos   –    recuerde   que   en   las   citas   con   meno s   d e   40   palabras   el   punto   se   pone   después.    Comience   una   cita   de   este   tipo   en   una   nueva   línea   y   sa ngre   el   párrafo   media   pulgada    (1.27   cm)   desde   el   margen   izquierdo   (en   la   misma   posición   que   un   nuevo   párrafo).   Si   hay    párrafos   adicionales   dentro   de   la   cita,   sangre   la   primera   línea   de   cada   párrafo   media    pulgada   adicional   (1.27   cm).    Al   final   de   una   cita   en   blo que,   cite   la   fuente   y   el   número   de   página   o   párrafo   entre    paréntesis   después   del   signo   de   puntuación   final.    Cita   en   bloque   con   paréntesis    En   este   modelo,   vas   a   agregar   al   final   de   la   cita,   el   apellido   del   autor,   el   año   de    public ación   de   la   obra   y   la   pá gina   dónde   se   encuentra   la   cita.       Cita   en   bloque   narrativa    Ten   en   cuenta   que,   si   empiezas   el   párrafo   con   la   información   sobre   el   autor   y   año,   podrás    agregar   al   final   de   la   cita   solamente   el   número   de   página   o   párrafo ,   como,   por   ejem plo:   \n44          Debes   tener   en   cu enta   que   para   una   cita   textual   de   menos   de   40   palabras ,   entonces    deberás   utilizar   otro   formato   de   presentación   en   el   texto.    Te   invitamos   también   a   leer   nue stra   entrada   sobre   la   di fere ncia   entre   Referencias   y    Bibliografía .        \n45       Referencias   Cada   fuente   que   cites   en   el   documento   debe   aparecer   en   su   lista   de   referencias;   por   lo    tanto,   cada   entrada   en   la   lista   de   r eferencia   debe   haber   sido   citada   en   su   texto.   De   lo    contrario,   deberás   agregar   la   entrada   en   la   bibliografía .   Puedes   leer   nuestro   artículo    sobre   la   diferencia   entre   cita,   referencia   y   bibliografía .    ¿Qué   no   debo   incluir?    Hay   algunos   tipos   de   trabajos   que   no   deben   ser   incluidos   en   la   lista   de   referencias.   Por   lo    general,   la   razón   por   la   cual   no   se   incluye   un   trabaj o   es   porque   los   lectores   no   podrán    recuperarlo   o   porque   la   mención   es   tan   amplia   que   los   lectores   no   necesitan   una   entrada    en   la   lista   de   referencias   para   comprender   el   uso.    •   Menciones   generales   de   páginas   web   completas,   publ icaciones   periódicas    completas   n o   re quieren   citas   en   el   texto   o   entradas   en   la   lista   de   referencias    porque   el   uso   es   amplio   y   la   fuente   es   familiar.    •   Las   comunicaciones   personales   como   correos   electrónicos,   llamadas   telefónicas    o   mensajes   de   texto   se   citan   solo   en   el   texto,   no   en   la   lista   de   referencias,    porque   los   lectores   no   pueden   recuperar   las   comunicaciones   personales.    •   Las   frases   o   mensajes   de   eventuales   entrevistados   en   la   investigación   pueden    ser   presentadas   y   discutidas   en   el   texto,   pero   no   necesitan   citas   ni   entradas   en    la   lista   d e   re ferencias.   En   este   caso,   no   es   necesario   una   cita   y   su   respectiva    referencia   porque   las   frases   son   parte   de   su   investigación   original.   Además,    también   podrían   comprometer   la   confidencialidad   de   los   participantes,   lo   cual   es    una   violación   ética.    •   La   fuen te   d e   una   dedicatoria   generalmente   no   aparece   en   la   lista   de   referencias    a   menos   que   el   trabajo   sea   un   libro   o   revista   académica.   Por   ejemplo,   si   agregas    al   comienzo   de   tu   documento   una   cita   inspiradora   de   un   famoso,   la   fuen te   de   la    cita   no   aparece   en   la   l ista   de   referencia   porque   la   cita   está   destinada   a    establecer   el   escenario   para   el   trabajo,   y   no   para   justificar   un   punto   clave.    Formato    La   lista   de   referencias   debe   iniciar   en   una   nueva   página   separada   del   texto.   El   título   de    esta   página   debe   ser   “Referen cias ”   y   debe   estar   centrado   en   la   parte   superior   de   la    página.   La   palabra   Referencias   debe   ir   en   negrita.   No   subraye   o   use   comillas   para   el    título.   Todo   el   texto   debe   estar   a   doble   espacio   al   igual   que   el   resto   de   tu   ensayo.   \n46       Además,   cada   entrada   en   su   list a   de   referencia   debe   tener   una   sangría   francesa   a   media    pulgada   (1,27   cm)   del   margen   izquierdo.       Elementos   de   una   referencia    Cada   entradas   en   una   lista   de   referencia   debe   incluir   los   cuatro   el emen tos   básicos   de   una    referencia:   el   autor ,   fecha   de   publicación ,   título   del   trabajo   y   fuente   para   recuperación .      \n47       Referencias   c on   información   incompleta    En   muchos   casos,   no   vamos   a   tener   la   refe rencia   completa.   Es   decir,   muchas   veces   nos    faltará   la   fecha   de   publicación,   el   año,   a   veces   no   encontramos   el   autor   de   determinado    texto   en   una   página   web.   Todos   estos   casos   están   contempl ados   en   ¿Cómo   escribir   una    Referencia   APA   sin   la   información   completa?    Ordenación   de   la   lista   de   referencias    La   lista   de   referencias   debe   ser   ordenada   en   alfabéticamente   por   el   primer   apellido   del    autor   seguido   de   la s   in iciales   del   nombre   del   autor.   Pero   ¿cómo   ordenar   varias   obras   del    mismo   autor?    Referencias   con   más   de   un   autor    Este   es   un   punto   dónde   hubo   actualización   de   las   Normas   APA   en   la   séptima   edición.   En    la   sexta   edición,   se   hablaba   de   hasta   7   autores   y   más   de   7   autores.   Ahora,   en   las   reglas    actualizadas,   hablamos   de   hasta   20   autores   y   de   más   de   20   autores.    Hasta   v einte   autores    Los   nombres   de   los   autores   deben   estar   invertidos   (Ap ellido,   Nombre);   Debes   informar    los   nombres   de   hasta   veinte   autores   en   la   lista   de   referencias.       Más   de   veinte   autores    Si   el   libro   tiene   más   de   veinte   autores,   debes   enumerar   los   primeros   19   autores   y   luego    utilizar   puntos   suspensivos   después   del   nomb re   d el   19°   autor.   Después   de   las   elipses,    escriba   el   nombre   del   último   autor   de   la   obra. es   puntos   de   este   estilo   de   publicación.    Formato   MLA   (Asociación   de   Lenguas   Modernas)    El   estilo   MLA,   también   conocido   como   formato   MLA,   es   un   estilo   de   presentación   de    tra bajos   escritos   creado   por   la   Asociación   de   Lenguas   M odernas   (en   inglés,   Modern    Language   Association ).    Es   usado   con   más   frecuencia   en   el   área   de   literatura,   filosofía,    estudios   culturales   y   áreas   afines.   Fue   creado   por   la   Modern   Language   Association   de    Estados   Unidos.   La   guía   más   reciente   fue   publicada   en   el   año   2016.   Recomendamos   la    lectura   de   Formato   MLA   (Asociación   de   Lenguas   Modernas)   para   q ue   puedas   formatear    tu   trabajo   de   manera   rápida   y   sencilla.    Normas   Vancouver    El   Estilo/Normas   Vancouver   es   un   estilo   utilizado,   principalmente,   en   e l   área   de   medicina.    Entre   las   revistas   médicas   que   utilizan   este   estilo   actualmente   se   destacan   MEDLINE   y    Pu bMed.   En   1978,   el   Comité   Internacional   de   Editores   de   Revistas   Médicas   (ICMJE),   se    reunió   en   Vancouver,   Canadá   para   llegar   a   un   acuerdo   sobre   un   con junto   de   requisitos    para   los   artículos   revistas   médicas.   Desde   entonces   el   estilo   de   referencia   de   Vancouver    utiliza   el   sistema   de   referencias   número/autor.   Números   dentro   del   texto   se   refieren   a    entradas   numeradas   en   la   lista   de   referencias.   Recomendamos   la   lectura   de   Normas    Vancouver   para   au xiliarte   en   adaptar   tu   trabajo   académico   a   este   estilo.   \n56       Normas   ICONTEC   –   NTC   1486    El   Instituto   Colombiano   de   Normas   Técnicas   y   Certificación   (ICONTE C),   es   la   entidad    responsable   por   la   normalización   en   Colombia.   Entre   sus   actividades   están   las    especificaciones   para   presentación   de   trabajos   escritos   en   escuelas,   colegios   y    universidades.   Esta   norma   es   conocida   en   también   como   NTC   1486   y   regula   desde   la    estructura   interna   del   documento   hasta   otros   aspectos,   como   el   tipo   de   papel   en   que   el    trabajo   debe   ser   presentado.   Ingresa   a   Normas   ICONTEC   –   NTC   1486   para   aprender   más    detalles   de   esta   norma.    Estilo   Harvard    El   Estilo   Harvard   también   utiliza   el   sistema   de   autor - año   (conocido   también   como    sistema   de   autor - fecha).   El   origen   del   estilo   autor - fecha   se   atribuye   a   un   artículo   de    Edward   Laurens   Mark,   profesor   de   anatomía   de   Hersey   y   dire ctor   del   laboratorio    zoológico   de   la   Universidad   de   Harvard,   que   puede   haberlo   copiado   del   sistema   de    catalogación   utilizado   en   ese   momento   y   ahora   por   la   biblioteca   de   Harvard.   Es   el   estilo    que   más   se   parece   al   Estilo   APA.           \n57       REFERENCIA       A merican   Psychological   Association.   (2020).   Publication   manual   of   the    American   Psychological   Associatio n   (7th   ed.).   https://doi.org/10.1037/0000165 -  000         \n";
